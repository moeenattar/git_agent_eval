[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "github-triage-eval"
version = "0.1.0"
description = "Evaluation-first GitHub issue triage agent using Google ADK"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-adk==2.8.0",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]
observability = [
  "arize-phoenix-otel>=0.16",
  "openinference-instrumentation-google-adk>=0.1",
]
groq = [
  "litellm==1.99.0",
]

[project.scripts]
triage = "github_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_triage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
