name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,groq]'
      - run: ruff check .
      - run: pytest
      - run: python scripts/validate_dataset.py datasets/calibration.jsonl datasets/golden_test.jsonl
